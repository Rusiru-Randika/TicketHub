spring.application.name=ticket-reservation-ui

# ---- Network: listen on ALL interfaces so phones on the same Wi-Fi (and ngrok) can reach it ----
server.port=8080
server.address=0.0.0.0
# Understand X-Forwarded-* headers sent by ngrok (https URL)
server.forward-headers-strategy=framework

# ---- MongoDB (override with env var MONGODB_URI for Atlas / Docker) ----
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ticket_reservation_db}
spring.data.mongodb.auto-index-creation=true

# ---- JWT (secret must be 48-63 characters so that HS384 is used) ----
app.jwt.secret=${JWT_SECRET:TicketReservationLab09SecretKeyForHS384Sign!!!!!}
app.jwt.expiration-ms=3600000
